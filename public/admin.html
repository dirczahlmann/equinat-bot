<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>EQUINAT Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#070B05;color:#F4EFE4;font-family:'DM Sans',system-ui;min-height:100vh;}
input,select,textarea,button{font-family:inherit;}

/* LOGIN */
#loginScreen{position:fixed;inset:0;background:#070B05;display:flex;align-items:center;justify-content:center;z-index:999;}
.login-card{background:#0A0F08;border:1px solid rgba(201,148,58,0.3);padding:2.5rem;width:100%;max-width:380px;text-align:center;}
.login-card h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:#E8B85A;margin-bottom:0.4rem;}
.login-card p{font-size:0.8rem;color:rgba(244,239,228,0.5);margin-bottom:1.8rem;}
.login-card input{width:100%;background:#111608;border:1px solid rgba(201,148,58,0.25);color:#F4EFE4;padding:0.8rem 1rem;font-size:0.9rem;outline:none;margin-bottom:0.85rem;border-radius:2px;}
.login-card input:focus{border-color:rgba(201,148,58,0.55);}
.login-card input::placeholder{color:rgba(244,239,228,0.25);}
.login-card button{width:100%;padding:0.85rem;background:#C9943A;color:#060A04;border:none;cursor:pointer;font-weight:700;font-size:0.85rem;letter-spacing:0.1em;text-transform:uppercase;border-radius:2px;}
.login-card button:hover{background:#E8B85A;}
.err{color:#ef4444;font-size:0.75rem;margin-top:0.5rem;}

/* MAIN */
#app{display:none;}
nav{background:#060A04;border-bottom:1px solid rgba(201,148,58,0.15);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:0.2em;color:#E8B85A;}
.nav-r{display:flex;align-items:center;gap:1rem;}
.nav-btn{background:rgba(201,148,58,0.1);border:1px solid rgba(201,148,58,0.25);color:#E8B85A;padding:0.35rem 0.9rem;font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;}
.nav-btn:hover{background:rgba(201,148,58,0.2);}

.main{padding:1.5rem;}

/* STATS ROW */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.85rem;margin-bottom:1.5rem;}
.stat{background:#0A0F08;border:1px solid rgba(201,148,58,0.15);padding:1.25rem;text-align:center;}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:400;color:#E8B85A;line-height:1;}
.stat-lbl{font-size:0.68rem;color:rgba(244,239,228,0.5);margin-top:0.35rem;letter-spacing:0.1em;text-transform:uppercase;}

/* FILTERS */
.filters{display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.filters input,.filters select{background:#0A0F08;border:1px solid rgba(201,148,58,0.2);color:#F4EFE4;padding:0.55rem 0.85rem;font-size:0.82rem;outline:none;border-radius:2px;}
.filters input:focus,.filters select:focus{border-color:rgba(201,148,58,0.45);}
.filters input::placeholder{color:rgba(244,239,228,0.25);}
.filters select option{background:#0A0F08;}
.refresh-btn{background:#C9943A;color:#060A04;border:none;padding:0.55rem 1.1rem;font-size:0.78rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;border-radius:2px;}
.refresh-btn:hover{background:#E8B85A;}

/* TABLE */
.table-wrap{background:#0A0F08;border:1px solid rgba(201,148,58,0.15);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.8rem;}
thead{background:rgba(201,148,58,0.08);}
th{padding:0.75rem 1rem;text-align:left;font-size:0.65rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:rgba(201,148,58,0.7);border-bottom:1px solid rgba(201,148,58,0.12);white-space:nowrap;}
td{padding:0.7rem 1rem;border-bottom:1px solid rgba(201,148,58,0.07);vertical-align:top;color:rgba(244,239,228,0.85);line-height:1.5;}
tr:hover td{background:rgba(27,47,20,0.2);}
tr:last-child td{border-bottom:none;}
.msg-q{color:rgba(244,239,228,0.9);max-width:280px;}
.msg-a{color:rgba(244,239,228,0.6);max-width:280px;font-size:0.75rem;}
.truncate{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.expand-btn{background:none;border:none;color:rgba(201,148,58,0.6);cursor:pointer;font-size:0.7rem;padding:2px 0;text-decoration:underline;}
.user-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;background:rgba(201,148,58,0.1);border:1px solid rgba(201,148,58,0.2);border-radius:100px;font-size:0.7rem;color:#E8B85A;white-space:nowrap;}
.ts{font-size:0.68rem;color:rgba(244,239,228,0.35);white-space:nowrap;}
.cnt-badge{display:inline-block;padding:2px 8px;background:rgba(74,222,128,0.12);border:1px solid rgba(74,222,128,0.2);border-radius:100px;font-size:0.68rem;color:#4ADE80;}

/* USER VIEW */
#userDetail{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:500;overflow-y:auto;padding:2rem 1rem;}
.ud-card{background:#0A0F08;border:1px solid rgba(201,148,58,0.25);max-width:680px;margin:0 auto;padding:1.75rem;}
.ud-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;}
.ud-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:#fff;}
.ud-close{background:none;border:none;color:rgba(244,239,228,0.5);font-size:1.5rem;cursor:pointer;}
.chat-log{display:flex;flex-direction:column;gap:0.75rem;}
.cl-q{background:rgba(201,148,58,0.1);border:1px solid rgba(201,148,58,0.2);padding:0.75rem 1rem;font-size:0.83rem;align-self:flex-end;max-width:85%;border-radius:3px;}
.cl-a{background:rgba(27,47,20,0.5);border:1px solid rgba(201,148,58,0.1);padding:0.75rem 1rem;font-size:0.83rem;max-width:90%;border-radius:3px;color:rgba(244,239,228,0.82);}
.cl-ts{font-size:0.62rem;color:rgba(244,239,228,0.3);text-align:center;padding:4px 0;}

.empty{text-align:center;padding:3rem;color:rgba(244,239,228,0.3);font-size:0.85rem;}
.loading{text-align:center;padding:2rem;color:rgba(201,148,58,0.5);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div style="font-size:2rem;margin-bottom:0.75rem;">🐴</div>
    <h1>EQUINAT Admin</h1>
    <p>Zugangsdaten eingeben</p>
    <input type="password" id="pwInput" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button onclick="doLogin()">→ Einloggen</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <nav>
    <div class="nav-logo">EQUINAT Admin Panel</div>
    <div class="nav-r">
      <span id="navInfo" style="font-size:0.72rem;color:rgba(244,239,228,0.4);"></span>
      <button class="nav-btn" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="main">
    <div class="stats" id="statsRow">
      <div class="stat"><div class="stat-val" id="s1">—</div><div class="stat-lbl">Gesamt Nachrichten</div></div>
      <div class="stat"><div class="stat-val" id="s2">—</div><div class="stat-lbl">Aktive Tester</div></div>
      <div class="stat"><div class="stat-val" id="s3">—</div><div class="stat-lbl">Heute</div></div>
      <div class="stat"><div class="stat-val" id="s4">—</div><div class="stat-lbl">Diese Woche</div></div>
    </div>

    <div class="filters">
      <input type="text" id="searchInp" placeholder="Suche in Fragen..." oninput="filterTable()"/>
      <select id="userFilter" onchange="filterTable()"><option value="">Alle Tester</option></select>
      <select id="dateFilter" onchange="filterTable()">
        <option value="">Alle Zeit</option>
        <option value="today">Heute</option>
        <option value="week">Diese Woche</option>
        <option value="month">Diesen Monat</option>
      </select>
      <button class="refresh-btn" onclick="loadData()">↻ Aktualisieren</button>
    </div>

    <div class="table-wrap">
      <div id="loadingMsg" class="loading">Lade Daten...</div>
      <table id="mainTable" style="display:none;">
        <thead>
          <tr>
            <th>Zeit</th>
            <th>Tester</th>
            <th>Frage</th>
            <th>Antwort (Auszug)</th>
            <th>Nachr. #</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty" style="display:none;">Keine Einträge gefunden.</div>
    </div>
  </div>
</div>

<!-- USER DETAIL -->
<div id="userDetail">
  <div class="ud-card">
    <div class="ud-header">
      <div class="ud-title" id="udTitle">Tester</div>
      <button class="ud-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="chat-log" id="udLog"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
// Admin password (change this!)
var ADMIN_PASS = 'EQUINAT2026';

// Netlify API config — set these after getting them from Netlify
// 1. Go to app.netlify.com → User settings → Applications → Personal access tokens
// 2. Create token, paste below
// 3. Get form ID from Netlify → your site → Forms → click eq-messages → URL contains form ID
var NETLIFY_TOKEN = ''; // Paste your token here
var NETLIFY_FORM_ID = ''; // Paste form ID here
// ────────────────────────────────────────────────────────

var allData = [];

function doLogin() {
  var pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('navInfo').textContent = '🟢 Eingeloggt';
    loadData();
  } else {
    document.getElementById('loginErr').textContent = '❌ Falsches Passwort';
    document.getElementById('pwInput').value = '';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pwInput').value = '';
}

async function loadData() {
  document.getElementById('loadingMsg').style.display = 'block';
  document.getElementById('mainTable').style.display = 'none';
  document.getElementById('emptyMsg').style.display = 'none';

  if (!NETLIFY_TOKEN || !NETLIFY_FORM_ID) {
    showSetupInstructions();
    return;
  }

  try {
    var page = 1;
    var all = [];
    while (true) {
      var res = await fetch(
        'https://api.netlify.com/api/v1/forms/' + NETLIFY_FORM_ID + '/submissions?per_page=100&page=' + page,
        { headers: { 'Authorization': 'Bearer ' + NETLIFY_TOKEN } }
      );
      if (!res.ok) throw new Error('API Fehler: ' + res.status);
      var data = await res.json();
      if (!data.length) break;
      all = all.concat(data);
      if (data.length < 100) break;
      page++;
    }
    allData = all;
    updateStats(all);
    populateUserFilter(all);
    renderTable(all);
  } catch(e) {
    document.getElementById('loadingMsg').innerHTML =
      '<span style="color:#ef4444;">Fehler: ' + e.message + '</span><br/><br/>' +
      '<small style="color:rgba(244,239,228,0.4);">Prüfe NETLIFY_TOKEN und NETLIFY_FORM_ID im Code.</small>';
  }
}

function showSetupInstructions() {
  document.getElementById('loadingMsg').innerHTML = `
    <div style="text-align:left;max-width:560px;margin:0 auto;">
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:#E8B85A;margin-bottom:1rem;">⚙️ Einmalige Einrichtung nötig</div>
      <div style="font-size:0.82rem;color:rgba(244,239,228,0.75);line-height:1.9;">
        <strong style="color:#F4EFE4;">Schritt 1: Netlify Personal Access Token</strong><br/>
        → app.netlify.com → dein Avatar → User settings → Applications<br/>
        → "New access token" → Namen eingeben → Token kopieren<br/><br/>
        <strong style="color:#F4EFE4;">Schritt 2: Form ID holen</strong><br/>
        → Netlify → equinat-bot Projekt → Forms → "eq-messages" anklicken<br/>
        → In der URL steht die Form ID (langer String)<br/><br/>
        <strong style="color:#F4EFE4;">Schritt 3: In diese Datei eintragen</strong><br/>
        → In admin.html oben: NETLIFY_TOKEN und NETLIFY_FORM_ID eintragen<br/>
        → Datei erneut in GitHub hochladen<br/><br/>
        <strong style="color:#F4EFE4;">Schritt 4: SITE_URL in Netlify setzen</strong><br/>
        → Netlify → Project configuration → Environment variables<br/>
        → SITE_URL = https://equinatbot.netlify.app hinzufügen
      </div>
    </div>`;
}

function updateStats(data) {
  var today = new Date(); today.setHours(0,0,0,0);
  var week = new Date(today); week.setDate(week.getDate() - 7);
  var todayCount = data.filter(d => new Date(d.created_at) >= today).length;
  var weekCount  = data.filter(d => new Date(d.created_at) >= week).length;
  var users = new Set(data.map(d => d.data && d.data.user_id).filter(Boolean));
  document.getElementById('s1').textContent = data.length;
  document.getElementById('s2').textContent = users.size;
  document.getElementById('s3').textContent = todayCount;
  document.getElementById('s4').textContent = weekCount;
}

function populateUserFilter(data) {
  var users = {};
  data.forEach(d => {
    if (d.data && d.data.user_id) {
      var id = d.data.user_id;
      var name = d.data.user_name || id.substring(0,8);
      users[id] = name;
    }
  });
  var sel = document.getElementById('userFilter');
  sel.innerHTML = '<option value="">Alle Tester</option>';
  Object.entries(users).forEach(([id, name]) => {
    sel.innerHTML += '<option value="' + id + '">' + name + ' (' + id.substring(0,8) + '...)</option>';
  });
}

function filterTable() {
  var search = document.getElementById('searchInp').value.toLowerCase();
  var userId = document.getElementById('userFilter').value;
  var dateF  = document.getElementById('dateFilter').value;
  var now = new Date();
  var filtered = allData.filter(d => {
    if (!d.data) return false;
    if (search && !(d.data.question || '').toLowerCase().includes(search) &&
                  !(d.data.answer   || '').toLowerCase().includes(search)) return false;
    if (userId && d.data.user_id !== userId) return false;
    if (dateF) {
      var dt = new Date(d.created_at);
      if (dateF === 'today') {
        var t = new Date(now); t.setHours(0,0,0,0);
        if (dt < t) return false;
      } else if (dateF === 'week') {
        var w = new Date(now); w.setDate(w.getDate()-7);
        if (dt < w) return false;
      } else if (dateF === 'month') {
        var m = new Date(now); m.setMonth(m.getMonth()-1);
        if (dt < m) return false;
      }
    }
    return true;
  });
  renderTable(filtered);
}

function renderTable(data) {
  document.getElementById('loadingMsg').style.display = 'none';
  if (!data.length) {
    document.getElementById('mainTable').style.display = 'none';
    document.getElementById('emptyMsg').style.display = 'block';
    return;
  }
  document.getElementById('mainTable').style.display = 'table';
  document.getElementById('emptyMsg').style.display = 'none';

  var rows = data.slice().reverse().map(d => {
    var dt = d.data || {};
    var ts = new Date(d.created_at).toLocaleString('de-DE', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    var name = dt.user_name || 'Unbekannt';
    var uid  = (dt.user_id  || '').substring(0,8);
    var q = (dt.question || '—').replace(/</g,'&lt;');
    var a = (dt.answer   || '—').replace(/</g,'&lt;');
    var cnt = dt.msg_count || '?';
    return '<tr>' +
      '<td class="ts">' + ts + '</td>' +
      '<td><div class="user-chip">🐴 ' + name + '</div><div style="font-size:0.62rem;color:rgba(244,239,228,0.3);margin-top:3px;">' + uid + '...</div></td>' +
      '<td class="msg-q"><div class="truncate">' + q + '</div></td>' +
      '<td class="msg-a"><div class="truncate">' + a + '</div></td>' +
      '<td><span class="cnt-badge">#' + cnt + '</span></td>' +
      '<td><button class="expand-btn" onclick=\'showDetail("' + (dt.user_id||'') + '")\'>→ Alle</button></td>' +
      '</tr>';
  }).join('');
  document.getElementById('tableBody').innerHTML = rows;
}

function showDetail(userId) {
  var userMsgs = allData.filter(d => d.data && d.data.user_id === userId).slice().reverse();
  if (!userMsgs.length) return;
  var name = userMsgs[0].data.user_name || userId.substring(0,8);
  document.getElementById('udTitle').textContent = '🐴 ' + name + ' — Alle Nachrichten (' + userMsgs.length + ')';
  var html = userMsgs.map(d => {
    var dt = d.data || {};
    var ts = new Date(d.created_at).toLocaleString('de-DE');
    return '<div class="cl-ts">' + ts + '</div>' +
           '<div class="cl-q">' + (dt.question||'').replace(/</g,'&lt;') + '</div>' +
           '<div class="cl-a">' + (dt.answer||'').replace(/</g,'&lt;') + '</div>';
  }).join('');
  document.getElementById('udLog').innerHTML = html;
  document.getElementById('userDetail').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('userDetail').style.display = 'none';
  document.body.style.overflow = '';
}

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
