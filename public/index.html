DEIN FACHWISSEN — IM DETAIL
═══════════════════════════════════════════════════

FÜTTERUNG:
- Raufutter-Grundregel: 1,5-2% Körpergewicht/Tag (also 7,5-10 kg Heu für 500kg-Pferd)
- Heunetz mit kleinen Maschen (3-4cm) verlangsamt Fressen, gut für Stoffwechselpferde
- Heuanalyse zeigt Zucker (WSC), Stärke, Eiweiß, Mineralien — sollte jedes Stallinhaberin machen
- Mineralfütterung: Selen, Kupfer, Zink, Mangan oft defizitär in deutschem Heu
- Kraftfutter nur bei realer Mehrleistung — sonst Risiko (Magengeschwüre, Stoffwechsel)
- Heulage: höhere Zucker-Verfügbarkeit, Vorsicht bei EMS und Hufrehe-Risiko
- Anweiden: schrittweise über 14 Tage, sonst Hufrehe-Gefahr
- Mash bei Senior, Magenproblemen, Wasserverweigerern

GESUNDHEIT — KRANKHEITSBILDER:

*Kolik:*
Symptome: Unruhe, Wälzen, häufiges Hinlegen/Aufstehen, Scharren, Schwitzen, Blick zum Bauch, fehlende/gesteigerte Darmgeräusche, Pulsanstieg über 60. → SOFORT TIERARZT. Bis Tierarzt da: führen wenn Pferd liegen will, nicht zwingen wenn ruhig liegt, Futter weg, Wasser stehen lassen.

*Hufrehe (akut):*
Schaukelstand (Vorderhufe nach vorn gestreckt, Last auf Hinterbeinen), warme Hufe, gespannter Puls an Fesselbeuger fühlbar, deutliche Lahmheit besonders auf hartem Boden, Schmerzgesicht. → SOFORT TIERARZT + HUFSCHMIED. Pferd auf weichen Boden (Sand, Späne dick), Bewegung nur wenn Tierarzt sagt.
Ursachen: Übergewicht, Frühlingsweide, EMS, Cushing, Belastungsrehe nach OP, Stress, Geburtsrehe.
Prävention: Weidemanagement, Mineralhaushalt, METABOLIC COMPLETE bei Risikopferden.

*Arthrose:*
Anlaufschwierigkeiten, schlechter im Kalten, einseitige Belastung, Steifigkeit nach Stehzeiten. Bewegung essentiell — nicht Stehzeit! Schritt-Phase 15 Min im Aufwärmen. JOINT COMPLETE als Daueraufbau, kombiniert mit angepasstem Hufbeschlag und Physiotherapie.

*RAO (frühere Bezeichnungen: COB, COPD, Heustauballergie):*
Husten beim Antraben, Belastungsdyspnoe, vermehrte Bauchatmung („Dampfrinne"), Nasenausfluss. Heu nass machen oder Heulage füttern, staubarme Box, viel Auslauf, kein Stroh. RESPIRA COMPLETE schleimlösend und antientzündlich.

*EMS (Equines Metabolisches Syndrom):*
Übergewicht (Body Condition Score über 7), Fettpolster Mähnenkamm/Schweifrübe/Schulter, Insulinresistenz, hohes Hufrehe-Risiko. Diagnose: Bluttest (Insulin, Glukose, oraler Glukose-Toleranz-Test). Therapie: konsequente Diät, Bewegung, Weidemanagement (Maulkorb, Auslaufzeiten), METABOLIC COMPLETE.

*Cushing/PPID:*
Meist ältere Pferde (über 15), Fellwechselstörung (langes welliges Fell, später Fellwechsel), Muskelabbau über Rücken, Trinken/Pinkeln vermehrt, Hufrehe-Schübe. Diagnose: Bluttest ACTH (Frühherbst optimal). Behandlung meist Pergolid (verschreibungspflichtig). METABOLIC COMPLETE als unterstützende Begleitung.

*Magengeschwüre (EGUS):*
Häufig bei Sport-/Stresspferden, Boxenhaltung, langen Fresspausen, viel Kraftfutter. Symptome: Leistungsabfall, Sattelzwang, Mäkeligkeit, wiederkehrende Koliken, Zähneknirschen. Diagnose: Gastroskopie. Therapie: Omeprazol, Fütterungsmanagement (24h-Heu, kein nüchternes Reiten), Stress reduzieren.

*Sommerekzem:*
Allergische Reaktion auf Speichel der Kriebelmücken (Culicoides). Mähnenkamm, Schweifrübe, Bauch — extremer Juckreiz, Scheuern, offene Stellen. Ekzemerdecke konsequent (Mai-Oktober!), Stallzeiten zu Dämmerung, Repellents, optimaler Allgemeinzustand.

*Sehnen-/Bandverletzungen:*
Akut: Wärme, Schwellung, Lahmheit. → Tierarzt + Schonung + ggf. Boxenruhe. Heilung Monate. Ultraschall-Kontrolle. Aufbautraining nur unter tierärztlicher Anleitung.

*Mauke:*
Hautentzündung Fessel/Köte, schlimmer bei nassen/morastigen Bedingungen. Reinigung, gründlich trocknen, evtl. antimykotische/antibakterielle Behandlung. Behaarung kürzen (vorsichtig), Stall trocken halten.

*Druse:*
Hochansteckende bakterielle Infektion (Streptococcus equi). Hohes Fieber, eitriger Nasenausfluss, geschwollene Lymphknoten Kehlgang. → SOFORT TIERARZT + Quarantäne ganzer Stall.

*Borreliose, Anaplasmose:*
Zeckenübertragene Erkrankungen. Diffuse Symptome (Müdigkeit, Lahmheiten wechselnd, Fieber). Bluttest beim Tierarzt.

HUFE:
- Beschlag vs. Barhuf: beide haben Berechtigung, individuelle Entscheidung mit Hufschmied/Hufpfleger
- Hufschmied/-pfleger alle 6-8 Wochen
- Hornqualität: Biotin (15-25mg/Tag), Zink, Methionin (DAILY COMPLETE deckt das ab)
- Strahlfäule: feuchte Boxen, Hygieneproblem — Boxen sauber, Strahl putzen, ggf. Behandlung
- Fühligkeit auf hartem Boden: oft Hornmangel, Hufrolle oder dünne Sohle

HALTUNG:
- Offenstall ideal — aber nicht jedes Pferd verträgt Gruppe
- Boxenhaltung: mindestens 5-6 Stunden Auslauf täglich, möglichst mit Sozialkontakt
- 24h-Heu (mit Pause-Möglichkeit für Stoffwechselpferde via Heunetze)
- Lüftung extrem wichtig, Ammoniakbelastung minimieren
- Sozialkontakt nicht verhandelbar — Pferde brauchen Pferde
- Senior-Pferde: kleine Herde, ranghohe Position, evtl. Senior-Stall

VERHALTEN & PSYCHE:

- Junge Pferde: Geduld, kleine Schritte, niemals zu früh, niemals zu viel
- Trauma-sensible Arbeit: positive Verstärkung, Vertrauen aufbauen, Druck minimieren

REITERLICHES:
- Sattel-Check alle 6-12 Monate (Pferde verändern sich!)
- Trense passend, scharfe Gebisse vermeiden

GUARDRAILS — NOTFÄLLE (KRITISCH!)
═══════════════════════════════════════════════════

Bei diesen Symptomen IMMER und SOFORT zum Tierarzt verweisen — keine Ausnahmen, kein „warten wir mal":

⚠️ KOLIK-SYMPTOME: Wälzen, Hinlegen/Aufstehen, Scharren, Schwitzen, Blick zum Bauch, fehlende Darmgeräusche, Pulsanstieg über 60
⚠️ HUFREHE AKUT: Schaukelstand, warme Hufe, gespannter Puls an Fesselbeuger, deutliche Lahmheit besonders auf hartem Boden
⚠️ HOHES FIEBER: über 39,0°C, besonders mit Apathie
⚠️ ATEMNOT: Belastungsdyspnoe in Ruhe, blaue Schleimhäute, Nüsterflattern
⚠️ STARKE BLUTUNG / GROSSE WUNDEN / AUGENVERLETZUNG
⚠️ KREUZVERSCHLAG: Steifheit, dunkler Urin, Muskelzittern, Festliegen
⚠️ GEBURT: Fehllage, langes Pressen ohne Fortschritt, Nachgeburtsverhalt > 3h
⚠️ AUGE: rotes/tränendes/zusammengekniffenes Auge — niemals selbst behandeln, keine Salben aus dem Schrank
⚠️ APATHIE: plötzlich teilnahmsloses, nicht-fressendes Pferd
⚠️ SCHOCK: kalte Ohren, blasse Schleimhäute, schwacher Puls
⚠️ DRUSE-VERDACHT: Fieber + dicke Lymphknoten Kehlgang
⚠️ FESTLIEGEN, das nicht aufstehen kann

/* ── Brand sanitizer: strips any Zafao/legacy mentions before display or API ── */
function sanitizeText(t) {
  if (!t) return t;
  return t
    // Zafao GmbH (Wiesbaden) → EQUINAT
    .replace(/Zafao\s+(GmbH|AG|Holding|Group)\s*\([^)]*\)/gi, "EQUINAT")
    // Zafao GmbH / Zafao AG → EQUINAT
    .replace(/Zafao\s+(GmbH|AG|Holding|Group)/gi, "EQUINAT")
    // Standalone Zafao → EQUINAT
    .replace(/\bZafao\b/gi, "EQUINAT")
    // Stranded "(Wiesbaden)" / ", Wiesbaden" after sanitize
    .replace(/\s+\(Wiesbaden\)/gi, "")
    .replace(/,\s*Wiesbaden/gi, "")
    // "Zahlmann Consulting" leftover from old prompts
    .replace(/Zahlmann\s+Consulting[^.,;]*/gi, "EQUINAT")
    // Double spaces from removals
    .replace(/  +/g, " ");
}

function md(t) {
  return (t || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/`(.*?)`/g, "<code style='background:rgba(201,148,58,0.12);padding:1px 5px;border-radius:2px;font-size:0.86em'>$1</code>")
    .replace(/\n\n/g, "<br/><br/>")
    .replace(/\n/g, "<br/>");
}

function timeGroup(ts) {
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000 / 60 / 60 / 24;
  if (diff < 1) return "Heute";
  if (diff < 2) return "Gestern";
  if (diff < 7) return "Diese Woche";
  if (diff < 30) return "Diesen Monat";
  return "Älter";
}

    return () => window.removeEventListener("resize", h);
  }, []);
  return m;
}

      if (data && data.content && Array.isArray(data.content)) {
        reply = data.content.map(b => b.text || "").join("") || reply;
      } else if (data && data.error) {
        reply = "⚠️ Fehler: " + (data.error.message || data.error);
      }
      // Sanitize bot reply before storing/displaying
      reply = sanitizeText(reply);

      setChats(prev => prev.map(c => c.id === chatId ? {
        ...c,
        messages: [...c.messages, { role: "bot", text: reply }],
        updatedAt: Date.now(),
      } : c));
    } catch (e) {
      setChats(prev => prev.map(c => c.id === chatId ? {
        ...c,
        messages: [...c.messages, { role: "bot", text: "⚠️ Verbindungsfehler. Bitte versuch es gleich nochmal." }],
        updatedAt: Date.now(),
      } : c));
    } finally {
      setLoading(false);
    }
  }

  /* ─── Filter & group chats ─── */
  const visibleChats = chats
    .filter(c => {
      const q = (search || "").toLowerCase().trim();
      if (q) {
        // Search is GLOBAL — ignores project filter so users find anything
        if (c.title.toLowerCase().includes(q)) return true;
        return c.messages.some(m => (m.text || "").toLowerCase().includes(q));
      }
      // No active search → apply project filter if set
      if (activeProjectId !== null && c.projectId !== activeProjectId) return false;
      return true;
    })
    .sort((a, b) => b.updatedAt - a.updatedAt);

  const groupedChats = visibleChats.reduce((acc, c) => {
    const g = timeGroup(c.updatedAt);
    if (!acc[g]) acc[g] = [];
    acc[g].push(c);
    return acc;
  }, {});
  const groupOrder = ["Heute", "Gestern", "Diese Woche", "Diesen Monat", "Älter"];
  const activeProject = projects.find(p => p.id === activeProjectId);

  /* ─── Render ─── */
  return (
    <div style={{
      width: "100%", height: "100%", display: "flex",
      background: T.bg, color: T.cream, fontFamily: T.fontBody,
      fontSize: "14px", overflow: "hidden", position: "relative",
    }}>

      <aside style={{

        transform: isMobile && !sidebarOpen ? "translateX(-105%)" : "translateX(0)",
        transition: "transform 0.25s ease",
        boxShadow: isMobile && sidebarOpen ? "4px 0 24px rgba(0,0,0,0.5)" : "none",
      }}>
        {/* Brand header */}
        <div style={{
          padding: "1.1rem 1rem 0.9rem", borderBottom: "1px solid " + T.borderS,
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: "0.65rem", minWidth: 0 }}>
            <div style={{
              padding: "0.42rem 0.7rem",
              borderRadius: "2px",
              background: "linear-gradient(135deg, " + T.gold + ", " + T.goldD + ")",
              fontFamily: T.fontDisplay, fontWeight: 600, fontSize: "0.92rem",
              color: T.bg, letterSpacing: "0.18em", flexShrink: 0, lineHeight: 1,
            }}>EQUINAT</div>
            <div style={{ minWidth: 0 }}>
              <div style={{
                fontFamily: T.fontDisplay, fontSize: "0.95rem", fontWeight: 500,
                lineHeight: 1, letterSpacing: "0.02em",
              }}>
                PferdeBot<sup style={{ fontSize: "0.5em", color: T.gold }}>®</sup>
              </div>
              <div style={{
                fontSize: "0.6rem", color: T.dim, letterSpacing: "0.12em",
                textTransform: "uppercase", marginTop: "3px", whiteSpace: "nowrap",

                Vet-validiert

            </div>
          </div>
          {isMobile && (
            <button onClick={() => setSidebarOpen(false)} style={{
              background: "transparent", border: "none", color: T.dim, cursor: "pointer", padding: "4px",
            }}><Icon name="x" size={18}/></button>
          )}
        </div>

        {/* New chat */}
        <div style={{ padding: "0.8rem 0.7rem 0.5rem" }}>

        {/* Scrollable list */}
        <div style={{ flex: 1, overflowY: "auto", padding: "0.3rem 0.5rem 1rem" }}>

                  onMoveTo={pid => moveChatToProject(c.id, pid)}

                />

              <div style={{
                fontFamily: T.fontDisplay, fontSize: "1.05rem", fontWeight: 500,
                letterSpacing: "0.01em", overflow: "hidden", textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}>
                {activeChat?.title || "EQUINAT PferdeBot"}
              </div>
              {activeChat?.projectId && (
                <div style={{
                  fontSize: "0.65rem", color: T.gold, letterSpacing: "0.05em",
                  display: "flex", alignItems: "center", gap: "4px", marginTop: "2px",
                }}>
                  <Icon name="folder" size={9}/> {projects.find(p => p.id === activeChat.projectId)?.name}
                </div>
              )}
            </div>
          </div>
          <div style={{
            display: "flex", alignItems: "center", gap: "0.4rem",
            fontSize: "0.7rem", color: T.dim, letterSpacing: "0.05em",

              width: "6px", height: "6px", borderRadius: "50%",
              background: "#7CB342", boxShadow: "0 0 6px rgba(124,179,66,0.6)",

            Online

        {/* Counter Bar */}
        <div style={{
          padding: "0.55rem 1.5rem 0.5rem",
          background: T.bg2,
          borderBottom: "1px solid " + T.borderS,

          <div style={{
            height: "3px", background: "rgba(201,148,58,0.12)",
            borderRadius: "2px", overflow: "hidden", marginBottom: "0.35rem",

            <div style={{
              height: "100%",
              width: Math.max(0, (MAX_MESSAGES - messageCount) / MAX_MESSAGES * 100) + "%",
              background: messageCount >= MAX_MESSAGES - 10
                ? "#D67B6B"
                : "linear-gradient(90deg, " + T.gold + ", " + T.goldL + ")",
              transition: "width 0.4s ease",
            }}/>
          </div>
          <div style={{
            fontSize: "0.62rem",
            color: messageCount >= MAX_MESSAGES - 10 ? "#D67B6B" : T.dim,
            textAlign: "right", letterSpacing: "0.04em",
          }}>
            {Math.max(0, MAX_MESSAGES - messageCount)} Nachrichten verbleibend
          </div>
        </div>

        {/* Messages */}
        <div style={{
          flex: 1, overflowY: "auto", padding: "1.5rem 1.5rem 1rem",
          display: "flex", flexDirection: "column",
        }}>
          {messages.length === 0 ? (
            <Welcome onPick={q => send(q)} project={activeProject}/>
          ) : (
            <>
              {messages.map((m, i) => <Message key={i} msg={m}/>)}
              {loading && <TypingDots/>}
              <div ref={messagesEnd}/>
            </>
          )}
        </div>

        {/* Disclaimer */}
        <div style={{
          padding: "0.5rem 1.5rem", fontSize: "0.65rem", color: T.dim2,
          textAlign: "center", borderTop: "1px solid " + T.borderS,
          background: "rgba(201,148,58,0.025)", flexShrink: 0,
        }}>
          ⚕️ Allgemeine Information — kein Ersatz für tierärztliche Beratung
        </div>

        {/* Input */}
        <div style={{
          padding: "0.85rem 1.5rem 1.1rem", background: T.bg2,
          borderTop: "1px solid " + T.borderS, flexShrink: 0,
        }}>
          <div style={{ display: "flex", gap: "0.6rem", alignItems: "flex-end" }}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
              }}
              placeholder="Frag den PferdeBot — z.B. »Wie viel Heu braucht mein Pferd täglich?«"
              rows={1}
              style={{
                flex: 1, padding: "0.7rem 0.95rem",
                background: T.bg3, border: "1px solid " + T.border,
                outline: "none", color: T.cream, fontFamily: T.fontBody,
                fontSize: "0.87rem", borderRadius: "2px", resize: "none",
                maxHeight: "120px", lineHeight: 1.4,
              }}
            />
            <button
              onClick={() => send()}
              disabled={loading || !input.trim()}
              style={{
                width: "44px", height: "44px",
                background: loading || !input.trim() ? T.borderS : T.gold,
                color: T.bg, border: "none", borderRadius: "2px",
                cursor: loading || !input.trim() ? "not-allowed" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0,
              }}>
              <Icon name="send" size={16}/>
            </button>
          </div>
        </div>
      </main>

      {/* Legal Modal */}
      {legalModal && (
        <LegalModal type={legalModal} onClose={() => setLegalModal(null)}/>
      )}
    </div>
  );
}

/* ── Sidebar Chat Item ── */
function ChatItem(props) {
  const { chat, active, renaming, renameVal, setRenameVal, onSelect, onMenuToggle, menuOpen, moveOpen, onRenameStart, onRenameDone, onDelete, onMoveStart, onMoveTo, projects } = props;
  const [hover, setHover] = useState(false);

  if (renaming) {
    return (
      <div style={{ padding: "0.3rem 0.55rem" }}>
        <input
          autoFocus type="text"
          value={renameVal}
          onChange={e => setRenameVal(e.target.value)}
          onKeyDown={e => {
            if (e.key === "Enter") onRenameDone();
