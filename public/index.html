═══════════════════════════════════════════════════
DEIN FACHWISSEN — IM DETAIL
═══════════════════════════════════════════════════

FÜTTERUNG:
- Raufutter-Grundregel: 1,5-2% Körpergewicht/Tag (also 7,5-10 kg Heu für 500kg-Pferd)
- Heunetz mit kleinen Maschen (3-4cm) verlangsamt Fressen, gut für Stoffwechselpferde
- Heuanalyse zeigt Zucker (WSC), Stärke, Eiweiß, Mineralien — sollte jedes Stallinhaberin machen
- Mineralfütterung: Selen, Kupfer, Zink, Mangan oft defizitär in deutschem Heu
- Kraftfutter nur bei realer Mehrleistung — sonst Risiko (Magengeschwüre, Stoffwechsel)
- Heulage: höhere Zucker-Verfügbarkeit, Vorsicht bei EMS und Hufrehe-Risiko
- Anweiden: schrittweise über 14 Tage, sonst Hufrehe-Gefahr
- Mash bei Senior, Magenproblemen, Wasserverweigerern

GESUNDHEIT — KRANKHEITSBILDER:

*Kolik:*
Symptome: Unruhe, Wälzen, häufiges Hinlegen/Aufstehen, Scharren, Schwitzen, Blick zum Bauch, fehlende/gesteigerte Darmgeräusche, Pulsanstieg über 60. → SOFORT TIERARZT. Bis Tierarzt da: führen wenn Pferd liegen will, nicht zwingen wenn ruhig liegt, Futter weg, Wasser stehen lassen.

*Hufrehe (akut):*
Schaukelstand (Vorderhufe nach vorn gestreckt, Last auf Hinterbeinen), warme Hufe, gespannter Puls an Fesselbeuger fühlbar, deutliche Lahmheit besonders auf hartem Boden, Schmerzgesicht. → SOFORT TIERARZT + HUFSCHMIED. Pferd auf weichen Boden (Sand, Späne dick), Bewegung nur wenn Tierarzt sagt.
Ursachen: Übergewicht, Frühlingsweide, EMS, Cushing, Belastungsrehe nach OP, Stress, Geburtsrehe.
Prävention: Weidemanagement, Mineralhaushalt, METABOLIC COMPLETE bei Risikopferden.

*Arthrose:*
Anlaufschwierigkeiten, schlechter im Kalten, einseitige Belastung, Steifigkeit nach Stehzeiten. Bewegung essentiell — nicht Stehzeit! Schritt-Phase 15 Min im Aufwärmen. JOINT COMPLETE als Daueraufbau, kombiniert mit angepasstem Hufbeschlag und Physiotherapie.

*RAO (frühere Bezeichnungen: COB, COPD, Heustauballergie):*
Husten beim Antraben, Belastungsdyspnoe, vermehrte Bauchatmung („Dampfrinne"), Nasenausfluss. Heu nass machen oder Heulage füttern, staubarme Box, viel Auslauf, kein Stroh. RESPIRA COMPLETE schleimlösend und antientzündlich.

*EMS (Equines Metabolisches Syndrom):*
Übergewicht (Body Condition Score über 7), Fettpolster Mähnenkamm/Schweifrübe/Schulter, Insulinresistenz, hohes Hufrehe-Risiko. Diagnose: Bluttest (Insulin, Glukose, oraler Glukose-Toleranz-Test). Therapie: konsequente Diät, Bewegung, Weidemanagement (Maulkorb, Auslaufzeiten), METABOLIC COMPLETE.

*Cushing/PPID:*
Meist ältere Pferde (über 15), Fellwechselstörung (langes welliges Fell, später Fellwechsel), Muskelabbau über Rücken, Trinken/Pinkeln vermehrt, Hufrehe-Schübe. Diagnose: Bluttest ACTH (Frühherbst optimal). Behandlung meist Pergolid (verschreibungspflichtig). METABOLIC COMPLETE als unterstützende Begleitung.

*Magengeschwüre (EGUS):*
Häufig bei Sport-/Stresspferden, Boxenhaltung, langen Fresspausen, viel Kraftfutter. Symptome: Leistungsabfall, Sattelzwang, Mäkeligkeit, wiederkehrende Koliken, Zähneknirschen. Diagnose: Gastroskopie. Therapie: Omeprazol, Fütterungsmanagement (24h-Heu, kein nüchternes Reiten), Stress reduzieren.

*Sommerekzem:*
Allergische Reaktion auf Speichel der Kriebelmücken (Culicoides). Mähnenkamm, Schweifrübe, Bauch — extremer Juckreiz, Scheuern, offene Stellen. Ekzemerdecke konsequent (Mai-Oktober!), Stallzeiten zu Dämmerung, Repellents, optimaler Allgemeinzustand.

*Sehnen-/Bandverletzungen:*
Akut: Wärme, Schwellung, Lahmheit. → Tierarzt + Schonung + ggf. Boxenruhe. Heilung Monate. Ultraschall-Kontrolle. Aufbautraining nur unter tierärztlicher Anleitung.

*Mauke:*
Hautentzündung Fessel/Köte, schlimmer bei nassen/morastigen Bedingungen. Reinigung, gründlich trocknen, evtl. antimykotische/antibakterielle Behandlung. Behaarung kürzen (vorsichtig), Stall trocken halten.

*Druse:*
Hochansteckende bakterielle Infektion (Streptococcus equi). Hohes Fieber, eitriger Nasenausfluss, geschwollene Lymphknoten Kehlgang. → SOFORT TIERARZT + Quarantäne ganzer Stall.

*Borreliose, Anaplasmose:*
Zeckenübertragene Erkrankungen. Diffuse Symptome (Müdigkeit, Lahmheiten wechselnd, Fieber). Bluttest beim Tierarzt.

HUFE:
- Beschlag vs. Barhuf: beide haben Berechtigung, individuelle Entscheidung mit Hufschmied/Hufpfleger

HALTUNG:

- Senior-Pferde: kleine Herde, ranghohe Position, evtl. Senior-Stall

VERHALTEN & PSYCHE:

- Stress reduzieren: Routine, Sozialkontakte, Beschäftigung, weniger Reizüberflutung

- Trauma-sensible Arbeit: positive Verstärkung, Vertrauen aufbauen, Druck minimieren

REITERLICHES:
- Sattel-Check alle 6-12 Monate (Pferde verändern sich!)
- Trense passend, scharfe Gebisse vermeiden
- Aufwärmen 15 Min Schritt langgezügelt
- Dehnung essentiell, Vorwärts-abwärts
- Junge Pferde: niemals zu früh anreiten (Wachstumsfugen!)
- Senior-Pferde: regelmäßige moderate Bewegung > Stehzeiten

GUARDRAILS — NOTFÄLLE (KRITISCH!)
═══════════════════════════════════════════════════

Bei diesen Symptomen IMMER und SOFORT zum Tierarzt verweisen — keine Ausnahmen, kein „warten wir mal":

⚠️ KOLIK-SYMPTOME: Wälzen, Hinlegen/Aufstehen, Scharren, Schwitzen, Blick zum Bauch, fehlende Darmgeräusche, Pulsanstieg über 60
⚠️ HUFREHE AKUT: Schaukelstand, warme Hufe, gespannter Puls an Fesselbeuger, deutliche Lahmheit besonders auf hartem Boden
⚠️ HOHES FIEBER: über 39,0°C, besonders mit Apathie
⚠️ ATEMNOT: Belastungsdyspnoe in Ruhe, blaue Schleimhäute, Nüsterflattern
⚠️ STARKE BLUTUNG / GROSSE WUNDEN / AUGENVERLETZUNG
⚠️ KREUZVERSCHLAG: Steifheit, dunkler Urin, Muskelzittern, Festliegen
⚠️ GEBURT: Fehllage, langes Pressen ohne Fortschritt, Nachgeburtsverhalt > 3h
⚠️ AUGE: rotes/tränendes/zusammengekniffenes Auge — niemals selbst behandeln, keine Salben aus dem Schrank
⚠️ APATHIE: plötzlich teilnahmsloses, nicht-fressendes Pferd
⚠️ SCHOCK: kalte Ohren, blasse Schleimhäute, schwacher Puls
⚠️ DRUSE-VERDACHT: Fieber + dicke Lymphknoten Kehlgang
⚠️ FESTLIEGEN, das nicht aufstehen kann

In all diesen Fällen: ZUERST Tierarzt-Hinweis. Dann erst weitere Information.

Bei Unsicherheit: lieber zu oft Tierarzt empfehlen als zu selten. Lieber einmal umsonst zahlen als ein Pferd verlieren.

═══════════════════════════════════════════════════
GUARDRAILS — SENSIBLE THEMEN
═══════════════════════════════════════════════════

EUTHANASIE / EINSCHLÄFERUNG:
Zurückhaltend, würdevoll, mitfühlend. Kein Marketing. Kein „aber probier doch mal noch…". Anerkennen, dass das eine der schwersten Entscheidungen ist. Tierarzt-Begleitung empfehlen. Trauer ist legitim und braucht Raum.

CHRONISCHE KRANKHEIT / SCHLECHTE PROGNOSE:
Realistisch bleiben — falsche Hoffnung verlängert Leid. EQUINAT-Produkte sind Unterstützung, keine Heilmittel. Sag das auch klar.

FINANZIELLE NOT bei Behandlung:
Ernst nehmen. Nicht moralisieren. Hinweise auf Tierschutzvereine, OP-Versicherungen, Tierärzt:innen mit Ratenzahlung. Praktisch helfen.

PROBLEMPFERDE / KAUFENTSCHEIDUNG:
Ehrlich. „Wenn das Pferd diese Schwächen hat und du Anfänger bist, ist das wahrscheinlich keine gute Kombination." Lieber ehrlich als gefällig.

GEWALT GEGEN PFERDE / VERWAHRLOSUNG:
Klar verurteilen, auf Tierschutzbehörde, Veterinäramt, Pferdeschutzvereine hinweisen.

DOPING / ILLEGALE METHODEN / TIERQUÄLEREI:
Niemals Anleitungen für Wettbewerbsmanipulation, Schmerzmittel-Missbrauch, Rolling, Barren, Hyperflexion etc. Klar Position beziehen.

/* ── Inline SVG Icons (Lucide-style) ── */
function Icon({ name, size = 16, color, style }) {
  const p = {
    width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: color || "currentColor", strokeWidth: 2,
    strokeLinecap: "round", strokeLinejoin: "round", style,
  };
  switch (name) {
    case "plus": return <svg {...p}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    case "folder": return <svg {...p}><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>;
    case "folder-plus": return <svg {...p}><path d="M12 10v6"/><path d="M9 13h6"/><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>;
    case "msg": return <svg {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    case "more": return <svg {...p}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "edit": return <svg {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
    case "chevron-down": return <svg {...p}><path d="m6 9 6 6 6-6"/></svg>;
    case "chevron-right": return <svg {...p}><path d="m9 18 6-6-6-6"/></svg>;
    case "menu": return <svg {...p}><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>;
    case "x": return <svg {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    case "send": return <svg {...p}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
    default: return null;
  }
}

/* ── localStorage helpers ── */
const STORAGE_KEY = "equinat-pferdebot-v2";
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { chats: [], projects: [] };
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function md(t) {
  return (t || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/`(.*?)`/g, "<code style='background:rgba(201,148,58,0.12);padding:1px 5px;border-radius:2px;font-size:0.86em'>$1</code>")
    .replace(/\n\n/g, "<br/><br/>")
    .replace(/\n/g, "<br/>");
}

function timeGroup(ts) {
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000 / 60 / 60 / 24;
  if (diff < 1) return "Heute";
  if (diff < 2) return "Gestern";
  if (diff < 7) return "Diese Woche";
  if (diff < 30) return "Diesen Monat";
  return "Älter";
}

function useIsMobile() {
  const [m, setM] = useState(typeof window !== "undefined" && window.innerWidth < 768);
  useEffect(() => {
    const h = () => setM(window.innerWidth < 768);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return m;
}

function PferdeBot() {
  const [chats, setChats] = useState([]);
  const [projects, setProjects] = useState([]);
  const [activeChatId, setActiveChatId] = useState(null);
  const [activeProjectId, setActiveProjectId] = useState(null);
  const [search, setSearch] = useState("");
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [projectsOpen, setProjectsOpen] = useState(true);
  const [menuChatId, setMenuChatId] = useState(null);
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState("");
  const [showNewProject, setShowNewProject] = useState(false);
  const [newProjectName, setNewProjectName] = useState("");
  const [moveMenuChatId, setMoveMenuChatId] = useState(null);
  const [messageCount, setMessageCount] = useState(0);
  const [hydrated, setHydrated] = useState(false);
  const messagesEnd = useRef(null);
  const inputRef = useRef(null);
  const isMobile = useIsMobile();

  /* Load on mount */
  useEffect(() => {
    const data = loadData();
    setChats(data.chats || []);
    setProjects(data.projects || []);
    setMessageCount(data.messageCount || 0);
    setHydrated(true);
  }, []);

  /* Save on changes */
  useEffect(() => {
    if (hydrated) saveData({ chats, projects, messageCount });
  }, [chats, projects, messageCount, hydrated]);

  /* Auto-scroll */
  useEffect(() => {
    messagesEnd.current?.scrollIntoView({ behavior: "smooth" });
  }, [activeChatId, chats, loading]);

  /* Close menus on outside click */
  useEffect(() => {
    const h = () => { setMenuChatId(null); setMoveMenuChatId(null); };
    if (menuChatId || moveMenuChatId) {
      window.addEventListener("click", h);
      return () => window.removeEventListener("click", h);
    }
  }, [menuChatId, moveMenuChatId]);

  const activeChat = chats.find(c => c.id === activeChatId);
  const messages = activeChat?.messages || [];

  function newChat(projectId) {
    const c = {
      id: uid(),
      title: "Neuer Chat",
      projectId: projectId !== undefined ? projectId : activeProjectId,
      messages: [],
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    setChats(prev => [c, ...prev]);
    setActiveChatId(c.id);
    setSidebarOpen(false);
    setTimeout(() => inputRef.current?.focus(), 80);
  }

  function deleteChat(id) {
    setChats(prev => prev.filter(c => c.id !== id));
    if (activeChatId === id) setActiveChatId(null);
    setMenuChatId(null);
  }

  function renameChat(id, title) {
    setChats(prev => prev.map(c => c.id === id ? { ...c, title: title || "Neuer Chat" } : c));
    setRenamingId(null);
  }

  function moveChatToProject(chatId, projectId) {
    setChats(prev => prev.map(c => c.id === chatId ? { ...c, projectId } : c));
    setMoveMenuChatId(null);
    setMenuChatId(null);
  }

  function newProject() {
    const name = newProjectName.trim();
    if (!name) return;
    const p = { id: uid(), name, createdAt: Date.now() };
    setProjects(prev => [...prev, p]);
    setNewProjectName("");
    setShowNewProject(false);
    setActiveProjectId(p.id);
  }

  function deleteProject(id) {
    if (!confirm("Projekt löschen? Chats bleiben erhalten und werden zurück in den Verlauf verschoben.")) return;
    setProjects(prev => prev.filter(p => p.id !== id));
    setChats(prev => prev.map(c => c.projectId === id ? { ...c, projectId: null } : c));
    if (activeProjectId === id) setActiveProjectId(null);
  }

  /* ─── Send message via Netlify function ─── */
  async function send(text) {
    const msg = (text || input).trim();
    if (!msg || loading) return;
    if (messageCount >= MAX_MESSAGES) {
      alert("Du hast dein Nachrichten-Limit erreicht.\n\nWerde EQUINAT-Abonnent für unbegrenzte Nachrichten — equinat.de");
      return;
    }

    let chatId = activeChatId;
    let chatRef = activeChat;

    if (!chatRef) {
      const c = {
        id: uid(),
        title: msg.length > 40 ? msg.slice(0, 40) + "…" : msg,
        projectId: activeProjectId,
        messages: [],
        createdAt: Date.now(),
        updatedAt: Date.now(),
      };
      setChats(prev => [c, ...prev]);
      setActiveChatId(c.id);
      chatId = c.id;
      chatRef = c;
    }

    const userMsg = { role: "user", text: msg };
    setChats(prev => prev.map(c => {
      if (c.id !== chatId) return c;
      const isFirst = c.messages.length === 0;
      return {
        ...c,
        messages: [...c.messages, userMsg],
        title: isFirst ? (msg.length > 40 ? msg.slice(0, 40) + "…" : msg) : c.title,
        updatedAt: Date.now(),
      };
    }));
    setInput("");
    setLoading(true);
    setMessageCount(c => c + 1);

    try {
      const history = [...(chatRef.messages || []), userMsg];
      const apiMessages = history.map(m => ({
        role: m.role === "bot" ? "assistant" : "user",
        content: m.text,
      }));

      const response = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system: SYSTEM, messages: apiMessages }),
      });

      const data = await response.json();
      let reply = "Entschuldige, ich konnte gerade nicht antworten. Versuch es nochmal.";
      if (data && data.content && Array.isArray(data.content)) {
        reply = data.content.map(b => b.text || "").join("") || reply;
      } else if (data && data.error) {
        reply = "⚠️ Fehler: " + (data.error.message || data.error);
      }

      setChats(prev => prev.map(c => c.id === chatId ? {
        ...c,
        messages: [...c.messages, { role: "bot", text: reply }],
        updatedAt: Date.now(),
      } : c));
    } catch (e) {
      setChats(prev => prev.map(c => c.id === chatId ? {
        ...c,
        messages: [...c.messages, { role: "bot", text: "⚠️ Verbindungsfehler. Bitte versuch es gleich nochmal." }],
        updatedAt: Date.now(),
      } : c));
    } finally {
      setLoading(false);
    }
  }

  /* ─── Filter & group chats ─── */
  const visibleChats = chats
    .filter(c => {
      if (activeProjectId !== null && c.projectId !== activeProjectId) return false;
      if (search) {
        const q = search.toLowerCase();
        if (c.title.toLowerCase().includes(q)) return true;
        return c.messages.some(m => m.text.toLowerCase().includes(q));
      }
      return true;
    })
    .sort((a, b) => b.updatedAt - a.updatedAt);

  const groupedChats = visibleChats.reduce((acc, c) => {
    const g = timeGroup(c.updatedAt);
    if (!acc[g]) acc[g] = [];
    acc[g].push(c);
    return acc;
  }, {});
  const groupOrder = ["Heute", "Gestern", "Diese Woche", "Diesen Monat", "Älter"];
  const activeProject = projects.find(p => p.id === activeProjectId);

  /* ─── Render ─── */

    <div style={{
      width: "100%", height: "100%", display: "flex",
      background: T.bg, color: T.cream, fontFamily: T.fontBody,
      fontSize: "14px", overflow: "hidden", position: "relative",
    }}>
      {/* SIDEBAR */}
      <aside style={{
        width: isMobile ? "85%" : "280px", maxWidth: "320px",
        background: T.side, borderRight: "1px solid " + T.border,
        display: "flex", flexDirection: "column", flexShrink: 0,
        position: isMobile ? "absolute" : "relative",
        height: "100%", zIndex: 50,
        transform: isMobile && !sidebarOpen ? "translateX(-105%)" : "translateX(0)",
        transition: "transform 0.25s ease",
        boxShadow: isMobile && sidebarOpen ? "4px 0 24px rgba(0,0,0,0.5)" : "none",
      }}>
        {/* Brand header */}
        <div style={{
          padding: "1.1rem 1rem 0.9rem", borderBottom: "1px solid " + T.borderS,
          display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: "0.6rem" }}>
            <div style={{
              width: "32px", height: "32px", borderRadius: "2px",
              background: "linear-gradient(135deg, " + T.gold + ", " + T.goldD + ")",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: T.fontDisplay, fontWeight: 600, fontSize: "1rem", color: T.bg,
            }}>EQ</div>
            <div>
              <div style={{ fontFamily: T.fontDisplay, fontSize: "1.05rem", fontWeight: 500, lineHeight: 1, letterSpacing: "0.02em" }}>
                PferdeBot<sup style={{ fontSize: "0.45em", color: T.gold }}>®</sup>
              </div>
              <div style={{ fontSize: "0.62rem", color: T.dim, letterSpacing: "0.12em", textTransform: "uppercase", marginTop: "3px" }}>
                Vet-validiert

          <div style={{
            marginTop: "1rem", paddingTop: "0.85rem",
            borderTop: "1px solid " + T.borderS,
          }}>
            <div style={{ padding: "0.45rem 0.55rem 0.5rem" }}>
              <span style={{
                fontSize: "0.62rem", color: T.dim, letterSpacing: "0.18em",
                textTransform: "uppercase", fontWeight: 500,
              }}>Themengebiete</span>
            </div>
            {SIDEBAR_TOPICS.map((tp, i) => (
              <SidebarTopicBtn key={i} topic={tp} onClick={() => { send(tp.q); setSidebarOpen(false); }}/>
            ))}
          </div>

          {/* ─── EXPERTENNETZWERK ─── */}
          <div style={{
            marginTop: "0.85rem", paddingTop: "0.85rem",
            borderTop: "1px solid " + T.borderS,
          }}>
            <div style={{ padding: "0.45rem 0.55rem 0.5rem" }}>
              <span style={{
                fontSize: "0.62rem", color: T.dim, letterSpacing: "0.18em",
                textTransform: "uppercase", fontWeight: 500,
              }}>Expertennetzwerk</span>
            </div>
            {EXPERTS.map((ex, i) => (
              <div key={i} style={{
                display: "flex", alignItems: "center", gap: "0.6rem",
                padding: "0.45rem 0.6rem",
              }}>
                <div style={{
                  width: "26px", height: "26px", borderRadius: "50%",
                  background: T.hover, border: "1px solid " + T.borderS,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  fontSize: "0.85rem", flexShrink: 0,
                }}>{ex.e}</div>
                <div style={{ minWidth: 0 }}>
                  <div style={{
                    fontSize: "0.74rem", color: T.cream, fontWeight: 500,
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                  }}>{ex.t}</div>
                  <div style={{
                    fontSize: "0.62rem", color: T.dim2, marginTop: "1px",
                    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                  }}>{ex.s}</div>
                </div>
              </div>
            ))}
          </div>

          {/* ─── ZUGANG ─── */}
          <div style={{
            marginTop: "0.85rem", paddingTop: "0.85rem",
            borderTop: "1px solid " + T.borderS,
          }}>
            <div style={{ padding: "0.45rem 0.55rem 0.5rem" }}>
              <span style={{
                fontSize: "0.62rem", color: T.dim, letterSpacing: "0.18em",
                textTransform: "uppercase", fontWeight: 500,
              }}>Zugang</span>
            </div>
            <div style={{
              padding: "0.7rem 0.85rem", margin: "0 0.4rem",
              background: T.hover, border: "1px solid " + T.borderS,
              borderRadius: "2px",
            }}>
              {PRICING.map((p, i) => (
                <div key={i} style={{
                  display: "flex", justifyContent: "space-between",
                  alignItems: "center", padding: "0.32rem 0",
                  borderTop: i > 0 ? "1px solid " + T.borderS : "none",
                }}>
                  <span style={{ fontSize: "0.72rem", color: T.cream }}>{p.label}</span>
                  <span style={{
                    fontSize: "0.74rem",
                    color: p.free ? "#7CB342" : T.gold,
                    fontWeight: 600, fontVariantNumeric: "tabular-nums",
                  }}>{p.value}</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{
          padding: "0.7rem 1rem", borderTop: "1px solid " + T.borderS,
          fontSize: "0.62rem", color: T.dim2, textAlign: "center", letterSpacing: "0.05em",
        }}>
          EQUINAT® · equinat.de
        </div>
      </aside>

      {/* Mobile backdrop */}
      {isMobile && sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{
          position: "absolute", inset: 0, background: "rgba(0,0,0,0.55)", zIndex: 40,
        }}/>
      )}

      {/* MAIN AREA */}
      <main style={{
        flex: 1, display: "flex", flexDirection: "column",
        background: T.bg, minWidth: 0, height: "100%",
      }}>
        <header style={{
          padding: "0.85rem 1.5rem", borderBottom: "1px solid " + T.borderS,
          display: "flex", alignItems: "center", justifyContent: "space-between",
          background: T.bg2, flexShrink: 0,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: "0.7rem", minWidth: 0 }}>
            {isMobile && (
              <button onClick={() => setSidebarOpen(true)} style={{
                background: "transparent", border: "none", color: T.cream,
                cursor: "pointer", padding: "4px",
              }}><Icon name="menu" size={20}/></button>
            )}
            <div style={{ minWidth: 0, overflow: "hidden" }}>
              <div style={{
                fontFamily: T.fontDisplay, fontSize: "1.05rem", fontWeight: 500,
                letterSpacing: "0.01em", overflow: "hidden", textOverflow: "ellipsis",
                whiteSpace: "nowrap",
              }}>
                {activeChat?.title || "EQUINAT PferdeBot"}
              </div>
              {activeChat?.projectId && (
                <div style={{
                  fontSize: "0.65rem", color: T.gold, letterSpacing: "0.05em",
                  display: "flex", alignItems: "center", gap: "4px", marginTop: "2px",
                }}>
                  <Icon name="folder" size={9}/> {projects.find(p => p.id === activeChat.projectId)?.name}
                </div>
              )}
            </div>
          </div>
          <div style={{
            display: "flex", alignItems: "center", gap: "0.4rem",
            fontSize: "0.7rem", color: T.dim, letterSpacing: "0.05em",
          }}>
            <div style={{
              width: "6px", height: "6px", borderRadius: "50%",
              background: "#7CB342", boxShadow: "0 0 6px rgba(124,179,66,0.6)",
            }}/>
            Online
          </div>
        </header>

        {/* Counter Bar */}
        <div style={{
          padding: "0.55rem 1.5rem 0.5rem",
          background: T.bg2,
          borderBottom: "1px solid " + T.borderS,
          flexShrink: 0,
        }}>
          <div style={{
            height: "3px", background: "rgba(201,148,58,0.12)",
            borderRadius: "2px", overflow: "hidden", marginBottom: "0.35rem",
          }}>
            <div style={{
              height: "100%",
              width: Math.max(0, (MAX_MESSAGES - messageCount) / MAX_MESSAGES * 100) + "%",
              background: messageCount >= MAX_MESSAGES - 10
                ? "#D67B6B"
                : "linear-gradient(90deg, " + T.gold + ", " + T.goldL + ")",
              transition: "width 0.4s ease",
            }}/>
          </div>
          <div style={{
            fontSize: "0.62rem",
            color: messageCount >= MAX_MESSAGES - 10 ? "#D67B6B" : T.dim,
            textAlign: "right", letterSpacing: "0.04em",
          }}>
            {Math.max(0, MAX_MESSAGES - messageCount)} Nachrichten verbleibend
          </div>
        </div>

        {/* Messages */}
        <div style={{
          flex: 1, overflowY: "auto", padding: "1.5rem 1.5rem 1rem",
          display: "flex", flexDirection: "column",
        }}>
          {messages.length === 0 ? (
            <Welcome onPick={q => send(q)} project={activeProject}/>
          ) : (
            <>
              {messages.map((m, i) => <Message key={i} msg={m}/>)}
              {loading && <TypingDots/>}
              <div ref={messagesEnd}/>
            </>
          )}
        </div>

        {/* Disclaimer */}
        <div style={{
          padding: "0.5rem 1.5rem", fontSize: "0.65rem", color: T.dim2,
          textAlign: "center", borderTop: "1px solid " + T.borderS,
          background: "rgba(201,148,58,0.025)", flexShrink: 0,
        }}>
          ⚕️ Allgemeine Information — kein Ersatz für tierärztliche Beratung
        </div>

        {/* Input */}
        <div style={{
          padding: "0.85rem 1.5rem 1.1rem", background: T.bg2,
          borderTop: "1px solid " + T.borderS, flexShrink: 0,
        }}>
          <div style={{ display: "flex", gap: "0.6rem", alignItems: "flex-end" }}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
              }}
              placeholder="Frag den PferdeBot — z.B. »Wie viel Heu braucht mein Pferd täglich?«"
              rows={1}
              style={{
                flex: 1, padding: "0.7rem 0.95rem",
                background: T.bg3, border: "1px solid " + T.border,
                outline: "none", color: T.cream, fontFamily: T.fontBody,
                fontSize: "0.87rem", borderRadius: "2px", resize: "none",
                maxHeight: "120px", lineHeight: 1.4,
              }}
            />
            <button
              onClick={() => send()}
              disabled={loading || !input.trim()}
              style={{
                width: "44px", height: "44px",
                background: loading || !input.trim() ? T.borderS : T.gold,
                color: T.bg, border: "none", borderRadius: "2px",
                cursor: loading || !input.trim() ? "not-allowed" : "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0,
              }}>
              <Icon name="send" size={16}/>
            </button>
          </div>
        </div>
      </main>
    </div>
  );
}

/* ── Sidebar Chat Item ── */
function ChatItem(props) {
  const { chat, active, renaming, renameVal, setRenameVal, onSelect, onMenuToggle, menuOpen, moveOpen, onRenameStart, onRenameDone, onDelete, onMoveStart, onMoveTo, projects } = props;
  const [hover, setHover] = useState(false);

  if (renaming) {
    return (
      <div style={{ padding: "0.3rem 0.55rem" }}>
        <input
          autoFocus type="text"
          value={renameVal}
          onChange={e => setRenameVal(e.target.value)}
          onKeyDown={e => {
            if (e.key === "Enter") onRenameDone();
            if (e.key === "Escape") onRenameDone();
          }}
          onBlur={onRenameDone}
          style={{
            width: "100%", padding: "0.42rem 0.55rem", background: T.bg2,
            border: "1px solid " + T.gold, outline: "none", color: T.cream,
            fontFamily: T.fontBody, fontSize: "0.78rem", borderRadius: "2px",
          }}
        />
      </div>
    );
  }

  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)} style={{ position: "relative" }}>
      <button onClick={onSelect} style={{
        width: "100%", display: "flex", alignItems: "center", gap: "0.5rem",
        padding: "0.45rem 0.6rem",
        background: active ? T.active : (hover ? T.hover : "transparent"),
        border: "none", borderRadius: "2px", cursor: "pointer", color: T.cream,
        fontFamily: T.fontBody, fontSize: "0.78rem", textAlign: "left",
      }}>
        <Icon name="msg" size={11} color={active ? T.gold : T.dim2}/>
        <span style={{
          flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          color: active ? T.cream : "rgba(244,239,228,0.8)",
        }}>{chat.title}</span>
        {(hover || menuOpen) && (
          <span onClick={onMenuToggle} style={{ padding: "2px", color: T.dim, display: "flex", borderRadius: "2px" }}>
            <Icon name="more" size={13}/>
          </span>
        )}
      </button>

      {menuOpen && !moveOpen && (
        <div onClick={e => e.stopPropagation()} style={{
          position: "absolute", right: "8px", top: "100%", marginTop: "2px",
          background: T.bg3, border: "1px solid " + T.border, borderRadius: "2px",
          minWidth: "150px", zIndex: 100, boxShadow: "0 4px 12px rgba(0,0,0,0.4)",
          overflow: "hidden",
        }}>
          <MenuBtn onClick={onRenameStart} icon={<Icon name="edit" size={11}/>}>Umbenennen</MenuBtn>
          <MenuBtn onClick={onMoveStart} icon={<Icon name="folder" size={11}/>}>Verschieben →</MenuBtn>
          <MenuBtn onClick={onDelete} icon={<Icon name="trash" size={11}/>} danger>Löschen</MenuBtn>
        </div>
      )}

      {moveOpen && (
        <div onClick={e => e.stopPropagation()} style={{
          position: "absolute", right: "8px", top: "100%", marginTop: "2px",
          background: T.bg3, border: "1px solid " + T.border, borderRadius: "2px",
          minWidth: "180px", maxHeight: "240px", overflowY: "auto", zIndex: 100,
          boxShadow: "0 4px 12px rgba(0,0,0,0.4)",
        }}>
          <div style={{
            padding: "0.5rem 0.7rem", fontSize: "0.6rem", color: T.dim,
            letterSpacing: "0.15em", textTransform: "uppercase",
            borderBottom: "1px solid " + T.borderS,
          }}>Verschieben in…</div>
          <MenuBtn onClick={() => onMoveTo(null)} icon={<Icon name="msg" size={11}/>}>(Kein Projekt)</MenuBtn>
          {projects.length === 0 && (
            <div style={{ padding: "0.6rem 0.7rem", fontSize: "0.72rem", color: T.dim2, fontStyle: "italic" }}>
              Noch keine Projekte
            </div>
          )}
          {projects.map(p => (
            <MenuBtn key={p.id} onClick={() => onMoveTo(p.id)} icon={<Icon name="folder" size={11} color={T.gold}/>}>
              {p.name}
            </MenuBtn>
          ))}
        </div>
      )}
    </div>
  );
}

function MenuBtn({ onClick, icon, children, danger }) {
  const [h, setH] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setH(true)}
      onMouseLeave={() => setH(false)}
      style={{
        width: "100%", display: "flex", alignItems: "center", gap: "0.5rem",
        padding: "0.5rem 0.7rem",
        background: h ? (danger ? "rgba(214,123,107,0.1)" : T.hover) : "transparent",
        border: "none", cursor: "pointer", color: danger ? "#D67B6B" : T.cream,
        fontFamily: T.fontBody, fontSize: "0.76rem", textAlign: "left",
      }}>
      {icon} {children}
    </button>
  );
}

/* ── Sidebar Topic Button (Themengebiete) ── */
function SidebarTopicBtn({ topic, onClick }) {
  const [h, setH] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseEnter={() => setH(true)}
      onMouseLeave={() => setH(false)}
      style={{
        width: "100%", display: "flex", alignItems: "center", gap: "0.6rem",
        padding: "0.5rem 0.6rem",
        background: h ? T.hover : "transparent",
        border: "none", borderRadius: "2px", cursor: "pointer",
        color: T.cream, fontFamily: T.fontBody, textAlign: "left",
        transition: "background 0.12s",
      }}>
      <span style={{ fontSize: "1.05rem", flexShrink: 0, lineHeight: 1 }}>{topic.e}</span>
      <span style={{ minWidth: 0, flex: 1 }}>
        <span style={{
          display: "block", fontSize: "0.76rem", fontWeight: 500,
          color: h ? T.goldL : T.cream,
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
          transition: "color 0.12s",
        }}>{topic.t}</span>
        <span style={{
          display: "block", fontSize: "0.62rem", color: T.dim2, marginTop: "1px",
          overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
        }}>{topic.s}</span>
      </span>
    </button>
  );
}

/* ── Welcome Screen ── */
function Welcome({ onPick, project }) {
  return (
    <div style={{
      flex: 1, display: "flex", flexDirection: "column",
      alignItems: "center", justifyContent: "center", padding: "2rem 1rem",
      animation: "fadeIn 0.4s ease",
    }}>
      <div style={{ fontSize: "3.5rem", marginBottom: "1rem" }}>🐴</div>
      <h1 style={{
        fontFamily: T.fontDisplay, fontSize: "2.2rem", fontWeight: 400,
        margin: "0 0 0.4rem", letterSpacing: "0.01em", textAlign: "center",
        color: T.cream,
      }}>
        {project ? <>In <em style={{ color: T.gold, fontStyle: "italic" }}>{project.name}</em></> : "Wie kann ich helfen?"}
      </h1>
      <p style={{
        fontSize: "0.88rem", color: T.dim, textAlign: "center",
        maxWidth: "440px", margin: "0 0 2rem", lineHeight: 1.55,
      }}>
        Dein KI-Experte für Pferd, Stall, Futter und Gesundheit — validiert durch unser tierärztliches Beiratsnetzwerk.
      </p>
      <div style={{
        display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))",
        gap: "0.6rem", width: "100%", maxWidth: "640px",
      }}>
        {TOPICS.map((t, i) => (
          <button key={i} onClick={() => onPick(t.q)} style={{
            display: "flex", alignItems: "center", gap: "0.7rem",
            padding: "0.85rem 1rem", background: T.bg3,
            border: "1px solid " + T.borderS, borderRadius: "2px",
            color: T.cream, fontFamily: T.fontBody, fontSize: "0.82rem",
            textAlign: "left", cursor: "pointer", transition: "all 0.18s",
            animation: "fadeIn 0.4s ease " + (i * 0.05) + "s backwards",
          }}
            onMouseEnter={e => {
              e.currentTarget.style.borderColor = T.gold;
              e.currentTarget.style.background = T.hover;
              e.currentTarget.style.transform = "translateY(-1px)";
            }}
            onMouseLeave={e => {
              e.currentTarget.style.borderColor = T.borderS;
              e.currentTarget.style.background = T.bg3;
              e.currentTarget.style.transform = "translateY(0)";
            }}>
            <span style={{ fontSize: "1.3rem", flexShrink: 0 }}>{t.e}</span>
            <span>{t.t}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ── Message ── */
function Message({ msg }) {
  const isBot = msg.role === "bot";
  return (
    <div style={{
      display: "flex", gap: "0.7rem", marginBottom: "1.1rem",
      flexDirection: isBot ? "row" : "row-reverse",
      animation: "fadeIn 0.3s ease",
    }}>
      <div style={{
        width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0,
        background: isBot ? "linear-gradient(135deg, " + T.gold + ", " + T.goldD + ")" : T.bg3,
        border: isBot ? "none" : "1px solid " + T.border,
        display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: isBot ? "1rem" : "0.7rem", fontWeight: 600,
        color: isBot ? T.bg : T.dim, letterSpacing: "0.05em",
      }}>{isBot ? "🐴" : "DU"}</div>
      <div
        style={{
          maxWidth: "75%", padding: "0.75rem 1rem",
          background: isBot ? T.bg3 : T.hover,
          border: "1px solid " + T.borderS, borderRadius: "2px",
          fontSize: "0.88rem", lineHeight: 1.6, color: T.cream,
        }}
        dangerouslySetInnerHTML={{ __html: md(msg.text) }}
      />
    </div>
  );
}

/* ── Typing Dots ── */
function TypingDots() {
  return (
    <div style={{ display: "flex", gap: "0.7rem", marginBottom: "1.1rem" }}>
      <div style={{
        width: "32px", height: "32px", borderRadius: "50%", flexShrink: 0,
        background: "linear-gradient(135deg, " + T.gold + ", " + T.goldD + ")",
        display: "flex", alignItems: "center", justifyContent: "center", fontSize: "1rem",
      }}>🐴</div>
      <div style={{
        padding: "0.85rem 1rem", background: T.bg3,
        border: "1px solid " + T.borderS, borderRadius: "2px",
        display: "flex", gap: "5px", alignItems: "center",
      }}>
        {[0, 1, 2].map(i => (
          <div key={i} style={{
            width: "6px", height: "6px", borderRadius: "50%", background: T.gold,
            animation: "bounce 1.3s ease infinite",
            animationDelay: (i * 0.15) + "s",
          }}/>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PferdeBot/>);
</script>
</body>
</html>
